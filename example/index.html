<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miko_ui 最小示例</title>
</head>

<body>
    <!--
      页面里只有一个空容器:窗口层 / 吸附预览 / Dock / 每个窗口的外壳与正文
      容器都由 `mountDesktop()` 建.示例只 import `miko_ui` 与本目录的模块,所以
      "库能被外部消费"在这里是可运行的,而不只是一条 grep 断言.

      两个窗口:一个放两条系数滑块(普通参数 + 循环参数),一个放读数.
      拖滑块或改数值框,读数跟着变.

      跑法(库仓库根目录):npm run dev
    -->
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
</body>

</html>
