name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 库自己的 CI:只需要 Node,不依赖任何消费者仓库 -- "能独立跑绿"就是"UI 与计算
  # 真的解耦了"最直接的证据.
  #
  # 三条只在交付时才炸的坑(交付链路本身见 RELEASING.md):
  # 1. `scripts.prepare` 必须以 `npm run build` 开头.`tsconfig.json` 把 example
  #    收进类型检查,example 又按包名自引用 `miko_ui`,而那份类型只来自
  #    `dist/index.d.ts`;fresh clone 里 `dist/` 不存在,`npm ci` 阶段不先构建,
  #    症状是一串 `TS7006: Parameter 'value' implicitly has an 'any' type`,
  #    看起来像 example 写错了.
  # 2. `package-lock.json` 只能用**完整** `npm install` 重建.
  #    `--package-lock-only` 只按当前平台算理想树,会丢掉 `lightningcss-*` /
  #    `@rolldown/binding-*` 这类跨平台可选依赖,于是这个 job 的 `npm ci` 与所有
  #    按这份锁安装的下游一起 EUSAGE(`Missing: ... from lock file`).
  # 3. 本地 Node 22 带 npm 10,CI Node 24 带 npm 11,对锁的校验严格程度不同:
  #    第 2 条只有 npm 11 会拒.动过锁或依赖之后跑一次
  #    `npx --yes npm@11 ci --no-audit --no-fund`.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # 边界守卫与提交钩子都是 Python,钉版本不吃 runner 镜像里的系统 Python.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `npm ci` 的 `prepare` 就是 `npm run build`;这里显式再跑一条,让失败信息
      # 归到"构建"名下.
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      # 一条命令 = package.json 的 build:`build:dist` -> typecheck(src + test +
      # example)-> 边界守卫 -> vitest;本地 / 消费者 / CI 跑的是同一条.
      - name: Build, typecheck and test
        run: npm run build

      # 消费者真正 import 的是 `dist/`,每次 push 都验一次它构建得出来.
      - name: Check build output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts

      # npm 包(链路 B)的清单前提:`private` / `version` / `files` 含 `dist`
      # (`.gitignore` 写着 `/dist`,npm 会照它排除,缺了发出去是空包).
      # 缺了的症状都只出现在 `npm publish` 那一刻.
      - name: Check npm publish prerequisites
        run: |
          node -e '
            const p = require("./package.json");
            if (p.private) throw new Error("package.json 带 private:npm publish 会被拒");
            if (!p.version) throw new Error("package.json 缺 version:npm 包必须有版本号");
            if (!Array.isArray(p.files) || !p.files.includes("dist")) {
              throw new Error("files 缺 dist:npm 会照 .gitignore 排除 dist/,发出去是空包");
            }
            if (!String(p.publishConfig?.registry ?? "").includes("registry.npmjs.org")) {
              throw new Error("publishConfig.registry 不是官方源:会被本机/镜像配置带偏");
            }
            console.log(`npm 发布前提就绪:miko_ui@${p.version}`);
          '

      # 资产链路(当前无消费者)在每个 PR/推送先打一遍,把两类只在取件方那边才炸的
      # 问题挡在合入前:资产打不出来(缺 dist/styles/LICENSE);清单漏进 `scripts`
      # (npm 装 `file:` 依赖时会跑它的 prepare).
      - name: Pack release asset (dry run)
        run: |
          npm run release:pack
          tar -tzf release/miko_ui_dist.tar.gz > release/asset.list
          for entry in ./package.json ./dist/index.js ./dist/index.d.ts ./styles/styles.css ./LICENSE; do
            grep -qx "$entry" release/asset.list
          done
          ! grep -qE '^\./scripts/' release/asset.list
          tar -xzOf release/miko_ui_dist.tar.gz ./package.json > release/asset.package.json
          node -e '
            const manifest = require("./release/asset.package.json");
            if (manifest.scripts) throw new Error("资产清单里带了 scripts: npm 装 file: 依赖时会跑 prepare");
            if (manifest.private) throw new Error("资产清单里带了 private");
            if (manifest.devDependencies) throw new Error("资产清单里带了 devDependencies");
            if (manifest.name !== "miko_ui") throw new Error("资产清单 name 不是 miko_ui");
            if (!manifest.exports?.["."]) throw new Error("资产清单缺 exports[\".\"]");
            if (!/^[0-9a-f]{40}$/.test(manifest.gitHead ?? "")) throw new Error("资产清单缺 gitHead:消费侧靠它判断缓存是不是最新");
            if (process.env.GITHUB_SHA && manifest.gitHead !== process.env.GITHUB_SHA) {
              throw new Error(`资产清单 gitHead(${manifest.gitHead})与本次构建 commit(${process.env.GITHUB_SHA})不一致`);
            }
          '
