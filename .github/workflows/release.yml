name: Release

# 推一个 `v` 开头的 tag 就发一版:`npm version patch && git push --follow-tags`.
#
# 认证方式:**Granular Access Token,存在仓库 secret `NPM_TOKEN` 里**。
#
# 为什么不用 Trusted Publishing(OIDC):它更安全(无长期凭据 + 自动 provenance),
# 但**配置 Trusted Publisher 属于 npm 的"账号治理操作"**,从 2026 年 8 月起这类
# 操作**永远要求交互式 2FA**,bypass-2FA token 在这里无效;而 npm 的 2FA 不是
# 验证器 App,是 **WebAuthn 安全密钥**(Touch ID / Windows Hello / YubiKey)。
# 没有这类硬件就没法配置,于是先用 token 这条路。
#
# 将来如果有了安全密钥,升级到 OIDC 只要三步(见 RELEASING.md §4):
#   1. 本文件:加回 `permissions: id-token: write`,删掉 publish 那步的
#      `env: NODE_AUTH_TOKEN`;
#   2. npmjs.com -> 包 Settings -> Trusted Publisher -> GitHub Actions,
#      填 owner / repo / workflow 文件名(只填文件名,带 .yml);
#   3. 之后就不需要 NPM_TOKEN 这个 secret 了,并且每个版本会自动带 provenance。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # 必须显式指到官方源:发布不能走镜像(镜像只读).
          # 它同时会写一条 `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
          # 到 .npmrc —— 下面 publish 那步的 env 就是喂给这一条的.
          registry-url: "https://registry.npmjs.org"
          # release 构建不引入依赖缓存这条供应链攻击面(官方示例的写法).
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      # tag 与 package.json 的版本必须一致,否则这一版发出去就再也收不回来.
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json 的 $PKG_VERSION 不一致"
            exit 1
          fi

      # `npm publish` 自己会按顺序跑 prepublishOnly(typecheck + test)与
      # prepack(build),所以这里不需要再重复一遍构建与测试.
      #
      # NPM_TOKEN 必须是 **Granular Access Token** 且:
      #   - Permissions 含 `Packages and scopes -> Read and write`
      #   - **勾上 "Bypass two-factor authentication"**(默认不勾,漏了就 403)
      # 自查办法见 RELEASING.md §2.1.
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
