name: Release

# ============================================================================
# 两条交付链路,互不干扰:
#
#   A. 滚动资产(`release` job,只在 main 上跑)
#      tag `ui-latest` + 资产 `miko_ui_dist.tar.gz`(包根 = dist/ + styles/ +
#      LICENSE + 运行期清单 package.json);文件名与 URL 不变,内容原地覆盖.
#      **当前没有消费者**:两个应用仓库都 `npm ci` 从 registry 装 `miko_ui`.
#      这条链路不读也不写 `version`.
#
#   B. npm 包(`publish` job,只在推 `v*` tag 时跑)
#      推 `v` 开头的 tag 就把同名包用 OIDC 信任发布发到 registry.npmjs.org;
#      两个应用仓库的主链路就是这条.`package.json` 的 `version` 只服务它.
#
# 为什么两条共用一个文件:npm 的 Trusted Publisher 只认 workflow **文件名**,
# 包设置里填的就是 `release.yml`,换文件名发布会被拒.
#
# 五条不变量,违反哪条这里都会红:
#   1. 资产清单是**运行期清单**,不带 `scripts`:npm 装 `file:` 链接的包时会先跑
#      目标的 `prepare`,而资产里没有 `scripts/` 也没有 devDependencies,那一步
#      必然 `MODULE_NOT_FOUND`.
#   2. 生产构建只跑一次:安装用 `npm ci --ignore-scripts`,闸门就是那条显式的
#      `npm run build`.依赖树里唯一的安装脚本是 darwin 专用的 `fsevents`
#      (可选依赖),跳过无副作用.
#   3. 资产原地覆盖同一个文件名,更新走 `gh release upload --clobber`(先传资产,
#      再挪 tag);不用"删掉 release 再建" -- 中间有一段 404 窗口.时间戳只进
#      release notes,**绝不进资产**:同一份内容每次构建的 sha256 必须相同.
#   4. 滚动资产只在 `main` 上跑;打包这件事本身由 `ci.yml` 的 dry-run 在每个
#      PR/推送上先验一遍.
#   5. 资产自证 commit:清单里的 `gitHead` 必须等于本次构建的 `GITHUB_SHA`.
# ============================================================================
on:
  push:
    branches: [main]
    # 推 `v*` tag = 向 npm 发一版(见下面的 publish job).发布提交必然改动
    # `package.json`(版本号),所以 tag 推送不会被 `paths-ignore` 挡掉.
    tags: ["v*"]
    # 纯文档改动不重出资产(资产里没有 README;LICENSE 变了要重出,所以只忽略
    # markdown).要强制重出一次:workflow_dispatch.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# 同一时间只跑一个发布:两个推送各跑一次时,后完成的那次覆盖资产 => 资产永远
# 对应最新一次成功构建.cancel-in-progress 关掉:不要腰斩正在上传的那次.
concurrency:
  group: release-ui-latest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---- A. 滚动资产:只在分支(main)上跑 -------------------------------------
  # 推 tag 时跳过:一次 tag 构建不该顺手把 `ui-latest` 资产覆盖成"某一个版本".
  release:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    # `gh release create/upload` 与 PATCH tag ref 都要写仓库
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 这一份是要挂到 release 上,被消费者直接吃下去的产物,不复用依赖缓存:
      # 少一条供应链面.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # 闸门里有 Python 写的边界守卫(`scripts/check_ui_boundary.py`).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `--ignore-scripts`:库的 `prepare` 就是 `npm run build`,不跳过的话这一步会
      # 顺手构建一遍,下面的显式闸门又构建一遍.依赖树里唯一的安装脚本是 darwin
      # 专用的 `fsevents`(可选依赖),跳过无副作用.
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 这次发布唯一的闸门:build:dist -> typecheck -> 边界守卫 -> vitest.
      - name: Build, typecheck and test
        run: npm run build

      - name: Pack release asset
        run: npm run release:pack

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ui-latest
          ASSET: release/miko_ui_dist.tar.gz
          ASSET_NAME: miko_ui_dist.tar.gz
        # 时间戳取本次发布的时刻,只进 notes(覆盖上传时 notes 会被一起重写),
        # 不进资产 -- 资产要可复现,理由见文件头不变量 3.
        run: |
          set -Eeuo pipefail
          test -f "$ASSET"
          SHA256="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            printf '## miko_ui rolling release (`ui-latest`)\n\n'
            printf '这是**滚动资产**,不是版本发布:tag 永远指向最新一次 main 构建,文件名与 URL 不变,内容被覆盖.\n'
            printf '资产不写版本号;交付形态就是下面这一个文件.\n\n'
            printf '| 项 | 值 |\n| --- | --- |\n'
            printf '| commit | `%s` |\n' "$GITHUB_SHA"
            printf '| 发布时间 (UTC) | `%s` |\n' "$STAMP"
            printf '| 资产 | `%s` |\n' "$ASSET_NAME"
            printf '| sha256 | `%s` |\n' "$SHA256"
            printf '| 内容 | `dist/` + `styles/` + `LICENSE` + 运行期清单 `package.json` |\n\n'
            printf '取件方(当前没有;两个应用从 npm 取)由取件脚本自动取;手动下载:\n\n'
            printf '```sh\ncurl -fL -o %s \\\n  %s/%s/releases/download/%s/%s\n```\n' \
              "$ASSET_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" "$ASSET_NAME"
          } > notes.md
          cat notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            # 资产先就位(URL 全程可用),再把 tag 挪到本次 commit;那个指针只是给
            # `git ls-remote --tags` 看的,消费者用的是固定 URL.
            gh release upload "$TAG" "$ASSET" --clobber
            # 覆盖上传不动 notes,得显式重写一次,否则表里的 sha256 与发布时间
            # 还停在上一份.
            gh release edit "$TAG" --notes-file notes.md
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "miko_ui rolling (ui-latest)" \
              --notes-file notes.md
          fi

          # 交付验收:从消费者用的那个公开 URL 重新下一次,比对 sha256(挂错 release /
          # 传到别处 / 下到旧的都在这里现形).刚覆盖完有一段传播延迟,给几次机会.
          ok=0
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 -o verify.tar.gz \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET_NAME" \
              && echo "$SHA256  verify.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
              echo "验收通过(第 ${attempt} 次下载):公开 URL 下到的 sha256 与本地一致"
              ok=1
              break
            fi
            echo "第 ${attempt} 次验收没对上,3 秒后重试..."
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::验收失败:公开 URL 下到的 ${ASSET_NAME} 与本地 sha256 不一致"
            exit 1
          fi

          # 验收之二:公开 URL 下回来的清单里,gitHead 必须等于本次构建的 commit
          # (取件方靠它判断缓存新旧).
          tar -xzOf verify.tar.gz ./package.json > verify.package.json
          node -e '
            const manifest = require("./verify.package.json");
            if (manifest.gitHead !== process.env.GITHUB_SHA) {
              console.error(
                `::error::资产清单 gitHead(${manifest.gitHead})与本次构建 commit(${process.env.GITHUB_SHA})不一致`,
              );
              process.exit(1);
            }
            console.log(`验收通过:资产 gitHead = ${manifest.gitHead}`);
          '

          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name)  \(.size) 字节")'

  # ---- B. npm 包:只在推 `v*` tag 时跑 -------------------------------------
  #
  # 为什么不需要任何 token:GitHub 为本次 job 签发一张**一次性 OIDC 身份票**,
  # npm 拿它比对"是不是这个仓库的这个 workflow 文件",对上就放行.没有长期凭据
  # 可偷,也不查账号 2FA(2FA 只约束建/删 token,改包设置这类账号级动作).
  #
  # 必须写在本文件里:Trusted Publisher 只认 workflow 文件名 `release.yml`,换
  # 文件名发布会 ENEEDAUTH;owner/repo/文件名三个字段 npm 保存时不校验,填错只有
  # 发布那一刻才报错.OIDC 路径不带 `NODE_AUTH_TOKEN`,`registry-url` 只决定往哪个
  # registry 发(必须是官方源).
  #
  # 发布前会把 `scripts.prepare` 从**工作树**摘掉:`npm publish` 打包前会自动跑
  # `prepare`,而 `npm publish --ignore-scripts` 拦不住它(实测 npm 10.9.8),不摘
  # 就会构建两遍.细节在那一步的注释里.
  #
  # 公开仓库 + 公开包 + OIDC => npm 自动附带 provenance,不需要加 `--provenance`.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 必需:少了这一行,npm 那边只会报 ENEEDAUTH
    # 同一时间只允许一个 npm 发布;不腰斩正在上传的那一次.
    concurrency:
      group: npm-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # 发布必须显式指到官方源:镜像只读,发不上去.
          registry-url: "https://registry.npmjs.org"
          # 不引入依赖缓存这条供应链攻击面(与 release job 同一条理由).
          package-manager-cache: false

      # 闸门里有 Python 写的边界守卫(`scripts/check_ui_boundary.py`).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `--ignore-scripts`:构建交给下面那条显式闸门,失败信息才归得到"构建"名下.
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 发出去的必须是通过全部检查的那棵树:build:dist -> typecheck -> 边界守卫
      # -> vitest.
      - name: Build, typecheck and test
        run: npm run build

      # OIDC 信任发布要求 npm CLI >= 11.5.1 / Node >= 22.14.0;先打出来,免得将来
      # runner 换 Node 大版本时看不出原因.
      - name: Show toolchain versions
        run: |
          node -v
          npm -v

      # tag 与 `package.json` 的版本必须一致:npm 不允许同版本重发,发错了收不回来.
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json 的 $PKG_VERSION 不一致"
            exit 1
          fi

      # 发布前把 `scripts.prepare` 从工作树里摘掉(只影响这次 CI 的 checkout,不提交):
      #
      #   `npm publish` 打包前会自动跑 `prepare`(= `npm run build`),不摘掉的话
      #   上面的闸门刚跑完,这一条又跑一次.
      #
      #   **`npm publish --ignore-scripts` 拦不住它**:那个开关只对 `npm ci` 阶段
      #   有效,对 pack/publish 阶段的 `prepare` 无效 -- 实测 npm 10.9.8 下
      #   `npm pack --dry-run --ignore-scripts` 照样把整个 build + 257 个测试跑了
      #   一遍.所以这里摘脚本,不加开关.
      #
      #   摘掉后 tarball 清单里也没有 `scripts.prepare`,与资产的运行期清单一致.
      #   下面那条自检是保险:`npm pkg delete` 对不存在的键不报错,万一将来
      #   `prepare` 改了名,必须在**上传之前**红.
      - name: Drop prepare so publish does not rebuild
        run: |
          npm pkg delete scripts.prepare
          node -e '
            const p = require("./package.json");
            if (p.scripts && p.scripts.prepare) {
              throw new Error("scripts.prepare 还在:publish 会再构建一次");
            }
            console.log("prepare 已摘除,publish 不会重复构建");
          '

      - name: Publish to npm
        run: npm publish
